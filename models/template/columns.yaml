# ===================================
#  Column Definitions
# ===================================

columns:

    title:
        label: renatio.dynamicpdf::lang.templates.name
        searchable: true

    code:
        label: renatio.dynamicpdf::lang.templates.code
        searchable: true

    description:
        label: renatio.dynamicpdf::lang.templates.description
        searchable: true

    layout:
        label: renatio.dynamicpdf::lang.templates.layout
        relation: layout
        select: name

    is_custom:
        label: renatio.dynamicpdf::lang.templates.is_custom
        type: switch

    preview:
        label: renatio.dynamicpdf::lang.templates.preview
        type: partial
        path: column_preview
        sortable: false
        clickable: false

    created_at:
        label: renatio.dynamicpdf::lang.templates.created_at
        type: datetime

    updated_at:
        label: renatio.dynamicpdf::lang.templates.updated_at
        type: datetime
