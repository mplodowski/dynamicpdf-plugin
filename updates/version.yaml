v8.0.4:
    - Security fix. Disable inline PHP in backend preview.
    - Security fix. Sandbox the HTML preview so template scripts cannot run in the backend session.
    - Security fix. Limit remote resources in the backend preview to the application host and local files to the asset directories.
    - Security fix. Self-signed certificates are accepted only with the allow_self_signed_certificates config, not on every non-production environment.
    - Require PHP 8.2 and October CMS 4.0.
    - Render templates and layouts with empty content instead of failing.
    - Throw on unknown wrapper methods instead of ignoring them.
    - Render a registered template or layout from its view when it is not stored yet.
    - Look a layout up once per code instead of once per template row when listing templates.
    - Complete the translations and add French, Italian, Dutch and Russian.
    - Synchronise registered views only in the backend and the demo command, and log a code whose view is missing instead of stopping the whole sync.
    - Add the layout argument to loadTemplate() to render with another layout without changing the template.
    - Add the locale argument to loadTemplate() and loadLayout() to render in another language and restore the previous one.
    - Add pageNumbers() to stamp page numbers without inline PHP.
    - Add the dynamicpdf:sync and dynamicpdf:check console commands.
    - Add toFile() and a chainable encrypt().
    - Add registerPDFVariables() and the beforeRender and afterRender events.
    - Add PDF::fake() with render assertions for project tests.
    - Render through the system Twig environment when the Cms module is missing or no theme is usable, and report CMS rendering errors instead of retrying with the system one.
v8.0.5:
    - Fix the 404 of the PDF preview under recent October 4.3 builds, which require lowercase action names.
    - Backend previews render with the sample data of the template, lists show customised and locked records, templates and layouts can be duplicated and previewed from the list.
    - Add a unique index on the template and layout code, removing duplicates left by concurrent syncs.
    - 20260907_0001_add_sample_data_to_templates_table.php
    - 20260907_0002_add_unique_code_indexes.php
v8.0.6:
    - Fix the backend form never marking an edited view-driven template as customised, and marking it customised when only the sample data was saved.
    - PDF::fake() replaces a wrapper the facade has already resolved.
