name = "Header and Footer"
pageNumbers = "bottom-center"
pageNumbersFont = "DejaVu Sans"
pageNumbersColor = "#6b7280"
==
<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <title>Header and Footer</title>
        <link href="{{ 'plugins/renatio/dynamicpdf/assets/css/tailwind.css'|pdfasset }}" rel="stylesheet">
        <style>
            @font-face {
                font-family: 'Open Sans';
                src: url('{{ 'plugins/renatio/dynamicpdf/assets/fonts/OpenSans-Regular.ttf'|pdfasset }}');
            }

            @font-face {
                font-family: 'Open Sans';
                font-weight: bold;
                src: url('{{ 'plugins/renatio/dynamicpdf/assets/fonts/OpenSans-Bold.ttf'|pdfasset }}');
            }

            @font-face {
                font-family: 'Open Sans';
                font-style: italic;
                src: url('{{ 'plugins/renatio/dynamicpdf/assets/fonts/OpenSans-Italic.ttf'|pdfasset }}');
            }

            @font-face {
                font-family: 'Open Sans';
                font-style: italic;
                font-weight: bold;
                src: url('{{ 'plugins/renatio/dynamicpdf/assets/fonts/OpenSans-BoldItalic.ttf'|pdfasset }}');
            }

            @page {
                margin: 0;
                padding: 0;
            }

            .page-break {
                page-break-before: always;
            }

            body {
                font-family: "Open Sans", sans-serif;
            }
        </style>
    </head>
    <body style="background-image: url('{{ 'plugins/renatio/dynamicpdf/assets/img/bg.jpg'|pdfasset }}'); background-size: 100% 100%;"
          class="bg-left-top bg-no-repeat pt-36">
        <div class="h-32 fixed top-0 px-12 mt-20 w-full text-gray-500">
            This is example header text
        </div>

        <div class="h-24 fixed bottom-0 px-12 w-full text-gray-500">
            This is example footer text
        </div>

        {{ content_html|raw }}
    </body>
</html>
